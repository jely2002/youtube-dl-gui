[package]
name = "ovd-dependency-resolver-tests"
version = "0.0.0"
edition = "2021"
publish = false

# Compile the production resolver and runtime adapter without a GUI/WebKit SDK.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.52", features = ["full"] }
regex = "1.12"
sha2 = "0.11"
hex = "0.4"
zip = "8.1.0"
tar = "0.4"
bzip2 = "0.6.1"
fs_extra = "1.3.0"
uuid = { version = "1.19", features = ["v4"] }

reqwest = { version = "0.13", features = ["json"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading"] }
